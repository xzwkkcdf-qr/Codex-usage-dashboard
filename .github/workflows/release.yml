name: Release Codex Usage Ledger

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable package
        shell: pwsh
        run: .\build-release.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex Usage Ledger v1.0.0 · Night Editorial
          generate_release_notes: true
          files: |
            artifacts/CodexUsageLedger-v1.0.0-win-x64.zip
            artifacts/CodexUsageLedger-v1.0.0-win-x64.sha256
